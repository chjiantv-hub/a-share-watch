<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="高高在上">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="manifest" id="mf" crossorigin="use-credentials">
<title>高高在上</title>
<style>
:root{--bg:#0b0f14;--card:#151b24;--card2:#1c2430;--line:#2a3545;--tx:#e8eef5;--mut:#8b98a8;--up:#ff4d4f;--dn:#1fbf6a;--acc:#4ea1ff;--warn:#f5a524;--yes:#ff6b6b;--hold:#8b98a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;overscroll-behavior-y:contain}
header{position:sticky;top:0;z-index:8;background:rgba(11,15,20,.97);backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid var(--line)}
header .top{display:flex;justify-content:space-between;align-items:center}
header h1{font-size:17px;margin:0;letter-spacing:.5px}
#hdr-r{font-size:11px;color:var(--mut);text-align:right;line-height:1.3}
#sticky{margin-top:8px;display:none}
#sticky .line{font-size:13px;font-weight:600;line-height:1.35}
#sticky .sub{font-size:11px;color:var(--mut);margin-top:2px}
main{padding:10px 10px 0;min-height:60vh}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:#0e141c;border-top:1px solid var(--line);padding:4px 0 calc(env(safe-area-inset-bottom) + 4px);box-shadow:0 -4px 20px rgba(0,0,0,.35)}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:8px 0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:500}
nav button b{font-size:20px;font-weight:700;line-height:1}
nav button.on{color:var(--acc)}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.card h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cat{margin-top:6px;font-size:12px;line-height:1.45}.cat .ci{margin-top:3px;word-break:break-all}.cat a{color:#8fb8ff;text-decoration:none}
.meta{font-size:11px;color:var(--mut);margin-top:8px;word-break:break-all;line-height:1.4}
.meta.err{color:var(--warn)}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}
.big{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.num{font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.g3{grid-template-columns:repeat(3,1fr)}
.kv{background:var(--card2);border-radius:10px;padding:10px 8px}
.kv .k{font-size:11px;color:var(--mut)}.kv .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-weight:500;text-align:right;padding:6px 3px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:8px 3px;border-bottom:1px solid #1d2632;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
td .n{font-size:14px;font-weight:700}td .c{font-size:11px;color:var(--mut);white-space:normal}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:#263142;color:var(--tx);margin:2px 3px 2px 0;font-weight:600}
.t-w2s,.t-yes{background:#3a1a1b;color:#ff8a8c}.t-watch{background:#3b2f12;color:#f5c451}
.t-fqzy,.t-hold{background:#12303a;color:#6cc7e8}.t-weak,.t-no{background:#252b35;color:#aab}.t-na{background:#252b35;color:#889}
.tier{font-size:32px;font-weight:900;letter-spacing:1px;line-height:1.15}
.crit{font-size:13px;padding:5px 0;display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #263142}
.ok{color:var(--up)}.no{color:var(--mut)}
input,select{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px;width:100%;min-height:44px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:700;min-height:44px;white-space:nowrap}
.btn.sec{background:#263142}.btn.sm{padding:8px 12px;font-size:13px;min-height:36px}
.row{display:flex;gap:8px;align-items:center}
.stock{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 2px;border-bottom:1px solid #1d2632}
.stock:last-child{border-bottom:0}
.stock .nm{font-size:16px;font-weight:800}.stock .sub{font-size:12px;color:var(--mut)}
.stock .px{text-align:right}
.ev{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #1d2632;font-size:13px}
.ev .t{color:var(--mut);width:44px;flex:none;font-variant-numeric:tabular-nums}
.lad{display:flex;gap:8px;padding:10px 0;border-bottom:1px solid #1d2632}
.lad .b{flex:none;width:52px;font-weight:900;font-size:18px;color:var(--up)}
.lad .s{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--card2);border-radius:8px;padding:4px 8px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip.on{background:#1a3a2a;color:#5fe29a;border:1px solid #2a5a40}
.chip.warn{background:#2a2210;color:#f5c451}
.btn.mini{padding:6px 10px;font-size:12px;min-height:32px;width:auto;display:inline-block}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.seg button{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:18px;padding:8px 12px;font-size:13px;font-weight:600;min-height:36px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.note{font-size:12px;color:var(--warn);background:#2a2210;border-radius:10px;padding:9px 10px;margin-bottom:8px;line-height:1.4}
.banner{font-size:14px;font-weight:800;background:#4a1515;border:1px solid var(--up);color:#ffb3b3;border-radius:12px;padding:12px;margin-bottom:10px;line-height:1.35}
.banner.warn{background:#2a2210;border-color:var(--warn);color:#f5c451}
.one{background:linear-gradient(135deg,#1a2330,#151b24);border:1px solid #2e3d52;border-radius:12px;padding:12px;margin-bottom:10px}
.one .t{font-size:15px;font-weight:800;line-height:1.35}
.one .p{font-size:12px;color:var(--mut);margin-top:4px}
.acard{background:var(--card2);border-radius:12px;padding:12px;margin-bottom:8px;border-left:3px solid #334}
.acard.yes{border-left-color:var(--up)}.acard.watch{border-left-color:var(--warn)}.acard.hold{border-left-color:#4a90a4}.acard.no{border-left-color:#555}.acard.na{border-left-color:#333}
.acard .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.acard .name{font-size:16px;font-weight:800}
.acard .pct{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.acard .grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.acard .cell .k{font-size:10px;color:var(--mut)}.acard .cell .v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.acard .reason{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.35}
.empty{text-align:center;color:var(--mut);padding:28px 12px;font-size:14px}
.loading{text-align:center;color:var(--mut);padding:40px 12px}
.pull{text-align:center;color:var(--mut);font-size:12px;padding:6px 0 2px;opacity:.7}
footer{text-align:center;color:var(--mut);font-size:12px;padding:12px 0 calc(72px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 54px);z-index:12;display:none;background:#3a1a1b;border:1px solid var(--up);border-radius:10px;padding:12px;font-size:14px}
details summary{cursor:pointer;color:var(--acc);font-size:13px;padding:6px 0;font-weight:600;min-height:36px;list-style:none}
details summary::-webkit-details-marker{display:none}
.more{display:block;width:100%;margin-top:8px}

.chart-wrap{margin-top:8px;background:var(--card2);border-radius:10px;padding:8px 8px 6px;grid-column:1/-1}
.chart-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.chart-hd .info{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.chart-seg{display:flex;gap:4px}
.chart-seg button{background:#263142;border:0;color:var(--mut);border-radius:12px;padding:4px 10px;font-size:12px;font-weight:700;min-height:28px}
.chart-seg button.on{background:var(--acc);color:#fff}
.chart-box{position:relative;width:100%;height:150px}
.chart-box canvas{width:100%;height:100%;display:block;touch-action:none}
.chart-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mut);pointer-events:none}
.stock{grid-template-columns:1fr auto;align-items:start}

.btn:disabled{opacity:.45;cursor:not-allowed}
.grok-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 8px;border-radius:999px;background:#263142;color:var(--mut);margin-left:8px;font-weight:600}
.grok-chip.off{background:#2a2210;color:var(--warn)}
.grok-chip.on{background:#12301f;color:#5fe29a}
#grokbox{position:fixed;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:14;max-height:55vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.55);display:none;padding:12px}
#grokbox .gh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
#grokbox .gh b{font-size:15px}
#grokbox .body{font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
#grokbox .body h2, #grokbox .body .h{font-size:14px;font-weight:800;margin:10px 0 4px;color:var(--acc)}
#grokbox .err{color:var(--warn)}
#grokbox .mut{font-size:11px;color:var(--mut);margin-top:8px}
</style></head>
<body>
<header>
  <div class="top"><h1>高高在上 <span id="grokchip" class="grok-chip off" title="Grok">Grok…</span></h1><div id="hdr-r">—</div></div>
  <div id="sticky"></div>
</header>
<div id="toast"></div>
<main id="main"><div class="loading">加载中…</div></main>
<footer>仅供参考，不构成投资建议 · 非 Level-2 行情</footer>
<div id="grokbox"></div>
<nav id="nav"></nav>
<script>
const TABS=[["watch","自","自选"],["alerts","铃","提醒"],["limit","板","涨停"],["pool","选","选股"],["auction","竞","竞价"],["sent","情","情绪"]];
const u=new URL(location.href); let TK=u.searchParams.get('t'); if(TK) localStorage.setItem('asw_t',TK); else TK=localStorage.getItem('asw_t')||'';
document.getElementById('mf').href='/manifest.webmanifest?t='+encodeURIComponent(TK);
let TAB=(location.hash||'#watch').slice(1); if(!TABS.find(t=>t[0]==TAB)) TAB='watch';
const $=s=>document.querySelector(s);
const NA='<span class="mut">未取到</span>';
function f(v,d=2,suf=''){return (v===null||v===undefined||Number.isNaN(v))?NA:(typeof v==='number'?v.toFixed(d):v)+suf}
function cls(v){return v>0?'up':(v<0?'dn':'')}
function pct(v){return (v===null||v===undefined)?NA:`<span class="${cls(v)}">${v>0?'+':''}${Number(v).toFixed(2)}%</span>`}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hm(s){return s&&s.length>=6?s.slice(0,2)+':'+s.slice(2,4)+':'+s.slice(4,6):(s||'')}
function meta(m,extra=''){ if(!m) return '';
  let s=`<div class="meta">来源：${esc(m.source||'—')}<br>拉取时间：${esc(m.fetched_at||'—')}（北京时间）${extra||''}</div>`;
  if(m.error) s+=`<div class="meta err">最近一次拉取失败（${esc(m.error_at||'')}）：${esc(m.error)}${m.fetched_at?'；显示的是上次成功的数据':''}</div>`;
  return s;}
async function api(path,opt={}){opt.headers=Object.assign({'X-Token':TK,'Content-Type':'application/json'},opt.headers||{});
  const r=await fetch(path,opt); if(!r.ok){let t=await r.text();try{t=JSON.parse(t).detail||t}catch(e){} throw new Error(t)} return r.json();}

/* ---------- Grok 解读 ---------- */
let GROK={configured:false,model:''};
function setGrokChip(){
  const el=$('#grokchip'); if(!el) return;
  if(GROK.configured){ el.className='grok-chip on'; el.textContent='Grok就绪'; el.title=GROK.model||''; }
  else { el.className='grok-chip off'; el.textContent='Grok未配置'; el.title='设置环境变量 XAI_API_KEY 后生效'; }
}
async function loadGrokStatus(){
  try{ const s=await api('/api/grok/status'); GROK={configured:!!s.configured, model:s.model||''}; }
  catch(e){ GROK={configured:false,model:''}; }
  setGrokChip();
}
function grokBtn(code){
  const dis=GROK.configured?'':' disabled';
  const tip=GROK.configured?'':' title="Grok 未配置：需设置 XAI_API_KEY"';
  return `<button class="btn mini sec"${dis}${tip} onclick="event.stopPropagation();grokExplain('stock','${code}')">Grok解读</button>`;
}
function grokMarketBtn(){
  const dis=GROK.configured?'':' disabled';
  const tip=GROK.configured?'':' title="Grok 未配置：需设置 XAI_API_KEY"';
  return `<button class="btn sec sm"${dis}${tip} onclick="grokExplain('market')">Grok解读盘面</button>`;
}
function closeGrok(){ const b=$('#grokbox'); if(b){ b.style.display='none'; b.innerHTML=''; } }
function renderGrokMd(text){
  return String(text||'').split(/\n/).map(line=>{
    const m=line.match(/^##\s+(.+)/);
    if(m) return `<div class="h">${esc(m[1])}</div>`;
    return esc(line)||' ';
  }).join('\n');
}
function showGrokBox(html){ const b=$('#grokbox'); b.style.display='block'; b.innerHTML=html; }
async function grokExplain(scope, code){
  if(!GROK.configured){ toast('Grok 未配置：请在云端环境变量设置 XAI_API_KEY'); showGrokBox(`<div class="gh"><b>Grok解读</b><button class="btn mini sec" onclick="closeGrok()">关闭</button></div><div class="body err">Grok 未配置。在 Render/ClawCloud 设置 <b>XAI_API_KEY</b> 后 Manual Deploy；密钥不会下发到手机。</div>`); return; }
  showGrokBox(`<div class="gh"><b>Grok解读中…</b><button class="btn mini sec" onclick="closeGrok()">关闭</button></div><div class="body mut">正在汇总页面缓存上下文并请求 xAI（约数十秒）…</div>`);
  try{
    const body={scope}; if(scope==='stock') body.code=code;
    const r=await api('/api/grok/explain',{method:'POST',body:JSON.stringify(body)});
    if(!r.ok){
      showGrokBox(`<div class="gh"><b>Grok解读</b><button class="btn mini sec" onclick="closeGrok()">关闭</button></div>
        <div class="body err">${esc(r.error||'失败')}</div>
        <div class="mut">${esc(r.model||'')} · ${esc(r.at||'')}</div>`);
      return;
    }
    showGrokBox(`<div class="gh"><b>Grok解读${scope==='market'?' · 盘面':(' · '+(code||''))}</b><button class="btn mini sec" onclick="closeGrok()">关闭</button></div>
      <div class="body">${renderGrokMd(r.text)}</div>
      <div class="mut">${esc(r.model||'')} · ${esc(r.at||'')} · ${(r.elapsed_ms!=null)?(r.elapsed_ms+'ms'):''}<br>上下文：${esc((r.used_context_keys||[]).join(', '))}</div>`);
  }catch(e){
    showGrokBox(`<div class="gh"><b>Grok解读</b><button class="btn mini sec" onclick="closeGrok()">关闭</button></div><div class="body err">${esc(e.message)}</div>`);
  }
}
function nav(){ $('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]==TAB?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('');}
function go(t){TAB=t;location.hash=t;nav();loadGrokStatus();render(true);window.scrollTo(0,0)}
let busy=false, stickyCache='';
function setSticky(html){ stickyCache=html||''; const el=$('#sticky'); if(html){el.style.display='block';el.innerHTML=html} else {el.style.display='none';el.innerHTML=''} }
async function render(force){ if(busy&&!force) return; busy=true;
  try{ await ({watch:rWatch,alerts:rAlerts,limit:rLimit,pool:rPool,auction:rAuction,sent:rSent})[TAB](); }
  catch(e){ setSticky(''); $('#main').innerHTML=`<div class="card"><div class="empty">加载失败：${esc(e.message)}</div></div>`; }
  busy=false;}

/* ---------- 自选 ---------- */
async function rWatch(){
  const d=await api('/api/watch');
  setSticky(`<div class="line">${esc(d.phase_cn)} · 自选 ${d.items.length} 只</div><div class="sub">行情拉取 ${esc((d.spot&&d.spot.fetched_at)||'—')} · 下拉可刷新</div>`);
  let h=`<div class="pull">↓ 下拉刷新</div><div class="card"><h2>自选股</h2>`;
  if(!d.items.length) h+=`<div class="empty">暂无自选，下方添加 6 位代码</div>`;
  for(const it of d.items){ const q=it.q;
    const kind=(CHART_KIND[it.code]||'minute');
    h+=`<div class="stock" data-code="${it.code}"><div><span class="nm">${esc(q?q.name:it.name)}</span> <span class="sub">${it.code} · ${esc(it.board)}</span>
      ${q&&q.at_zt?'<span class="tag t-w2s">涨停</span>':''}${q&&q.at_dt?'<span class="tag" style="background:#12301f;color:#5fe29a">跌停</span>':''}
      <div class="sub">量比 ${q?f(q.vol_ratio):NA} · 换手 ${q?f(q.turnover_pct,2,'%'):NA} · 额 ${q?f(q.amount_yi,2,'亿'):NA}</div>
      <div class="sub">涨停 ${q?f(q.limit_up):NA} · 跌停 ${q?f(q.limit_down):NA} · 开${q?f(q.open):NA} 高${q?f(q.high):NA} 低${q?f(q.low):NA}</div>
      <div class="sub">行情时间 ${q?esc(q.time):NA}</div></div>
      <div class="px"><div class="big ${q?cls(q.pct):''}">${q?f(q.price):NA}</div><div class="num" style="font-size:15px;font-weight:700">${q?pct(q.pct):''}</div>
      <button class="btn sec sm" style="margin-top:6px" onclick="delW('${it.code}')">移除</button>
      <div style="margin-top:6px">${grokBtn(it.code)}</div></div>
      <div class="chart-wrap">
        <div class="chart-hd">
          <div class="chart-seg">
            <button class="${kind==='minute'?'on':''}" onclick="setChartKind('${it.code}','minute')">分时</button>
            <button class="${kind==='day'?'on':''}" onclick="setChartKind('${it.code}','day')">日K</button>
          </div>
          <div class="info" id="chinfo-${it.code}">—</div>
        </div>
        <div class="chart-box"><canvas id="cv-${it.code}"></canvas><div class="chart-msg" id="chmsg-${it.code}">加载中…</div></div>
      </div></div>`;}
  h+=`<div class="row" style="margin-top:12px"><input id="wcode" inputmode="numeric" maxlength="6" placeholder="输入6位代码添加自选"><button class="btn" onclick="addW()">添加</button></div>
     <div class="meta">自选与 watchlist.md 同步</div>${meta(d.spot)}</div>`;
  h+=`<div class="card"><h2>自选异动 <span class="mut" style="font-size:12px">${d.events_day}${d.events.length&&d.events[0].src=='replay'?' · 回放':''}</span></h2>`;
  h+=d.events.length?d.events.slice(0,40).map(e=>`<div class="ev"><span class="t">${esc(e.time)}</span><div><b>${esc(e.name)}</b> <span class="tag ${/涨|放量/.test(e.kind)&&!/开板|跌/.test(e.kind)?'t-w2s':'t-fqzy'}">${esc(e.kind)}</span><div class="mut">${esc(e.detail)}</div></div></div>`).join('')+(d.events.length>40?`<button class="btn sec more" onclick="this.previousSibling">共 ${d.events.length} 条</button>`:''):`<div class="empty">暂无异动</div>`;
  h+=`<div class="meta">规则：5分钟涨跌≥2%；分钟量≥前20分钟均量5倍；触及/打开涨跌停；盘中量比≥3。</div>${meta(d.minutes)}`;
  if(d.minutes&&d.minutes.errors&&Object.keys(d.minutes.errors).length) h+=`<div class="meta err">未取到分时：${esc(JSON.stringify(d.minutes.errors))}</div>`;
  $('#main').innerHTML=h+'</div>';
  for(const it of d.items){ loadChart(it.code, CHART_KIND[it.code]||'minute'); }
}

const CHART_KIND={}, CHART_CACHE={}, CHART_LOAD={};
const UP='#ff4d4f', DN='#1fbf6a', MUT='#8b98a8', LINE='#2a3545';
function setChartKind(code,kind){ CHART_KIND[code]=kind; loadChart(code,kind,true); }
function hm4(t){ t=String(t||''); if(t.length<4) return t; return t.slice(0,2)+':'+t.slice(2,4); }
function sessionX(t){
  /* map HHMM to [0,1] across 09:30-11:30 + 13:00-15:00 (240 minutes) */
  const n=parseInt(t,10); if(!Number.isFinite(n)) return 0;
  let m;
  if(n<=1130){ m=Math.max(0, (Math.floor(n/100)-9)*60+(n%100)-30); m=Math.min(m,120); }
  else { m=120+Math.max(0,(Math.floor(n/100)-13)*60+(n%100)); m=Math.min(m,240); }
  return m/240;
}
function fitCanvas(cv){
  const box=cv.parentElement, dpr=Math.min(window.devicePixelRatio||1,2);
  const w=box.clientWidth||300, h=box.clientHeight||150;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w,h};
}
function drawMinute(cv, data){
  const {ctx,w,h}=fitCanvas(cv); ctx.clearRect(0,0,w,h);
  const bars=data.bars||[], prec=data.prec;
  if(!bars.length) return false;
  const padL=2, padR=2, padT=6, padB=18, pw=w-padL-padR, ph=h-padT-padB;
  const prices=bars.map(b=>b.p).filter(x=>x!=null);
  if(prec!=null) prices.push(prec);
  let lo=Math.min(...prices), hi=Math.max(...prices);
  if(hi===lo){ hi+=0.01; lo-=0.01; }
  const yOf=p=>padT+(hi-p)/(hi-lo)*ph;
  const xOf=t=>padL+sessionX(t)*pw;
  // grid / lunch gap
  ctx.strokeStyle=LINE; ctx.lineWidth=1; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(padL+0.5*pw,padT); ctx.lineTo(padL+0.5*pw,padT+ph); ctx.stroke();
  ctx.setLineDash([]);
  if(prec!=null){
    const y=yOf(prec); ctx.strokeStyle=MUT; ctx.globalAlpha=.55; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+pw,y); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
  }
  const last=bars[bars.length-1].p;
  const col=(prec!=null?(last>prec?UP:(last<prec?DN:MUT)):(last>=bars[0].p?UP:DN));
  ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.beginPath();
  bars.forEach((b,i)=>{ const x=xOf(b.t), y=yOf(b.p); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.stroke();
  // fill under line
  ctx.beginPath();
  bars.forEach((b,i)=>{ const x=xOf(b.t), y=yOf(b.p); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.lineTo(xOf(bars[bars.length-1].t), padT+ph); ctx.lineTo(xOf(bars[0].t), padT+ph); ctx.closePath();
  ctx.fillStyle=col; ctx.globalAlpha=.12; ctx.fill(); ctx.globalAlpha=1;
  ctx.fillStyle=MUT; ctx.font='10px -apple-system,sans-serif';
  ctx.fillText('09:30', padL, h-4);
  ctx.fillText('11:30/13:00', padL+pw*0.5-28, h-4);
  ctx.fillText('15:00', padL+pw-28, h-4);
  return true;
}
function drawDay(cv, data){
  const {ctx,w,h}=fitCanvas(cv); ctx.clearRect(0,0,w,h);
  const bars=data.bars||[]; if(!bars.length) return false;
  const volH=Math.floor(h*0.22), padL=2, padR=2, padT=6, padB=4;
  const bodyH=h-volH-padT-padB-2, volTop=padT+bodyH+4;
  const pw=w-padL-padR;
  const hi=Math.max(...bars.map(b=>b.h)), lo=Math.min(...bars.map(b=>b.l));
  const span=(hi===lo)?0.01:(hi-lo);
  const yOf=p=>padT+(hi-p)/span*bodyH;
  const maxV=Math.max(...bars.map(b=>b.v||0), 1);
  const slot=pw/bars.length;
  bars.forEach((b,i)=>{
    const x=padL+(i+0.5)*slot;
    const up=b.c>=b.o; const col=up?UP:DN;
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,yOf(b.h)); ctx.lineTo(x,yOf(b.l)); ctx.stroke();
    const y1=yOf(Math.max(b.o,b.c)), y2=yOf(Math.min(b.o,b.c));
    const bw=Math.max(1.5, slot*0.62);
    ctx.fillRect(x-bw/2, y1, bw, Math.max(1, y2-y1));
    if(b.v!=null){
      const vh=(b.v/maxV)*volH;
      ctx.globalAlpha=.55; ctx.fillRect(x-bw/2, volTop+volH-vh, bw, Math.max(1,vh)); ctx.globalAlpha=1;
    }
  });
  return true;
}
async function loadChart(code, kind, force){
  kind=kind||'minute'; CHART_KIND[code]=kind;
  const msg=document.getElementById('chmsg-'+code), info=document.getElementById('chinfo-'+code), cv=document.getElementById('cv-'+code);
  if(!cv) return;
  // update segment buttons without full re-render
  const wrap=cv.closest('.chart-wrap');
  if(wrap){ wrap.querySelectorAll('.chart-seg button').forEach(b=>{ b.classList.toggle('on', b.textContent.trim()===(kind==='minute'?'分时':'日K')); }); }
  const ck=kind+':'+code;
  if(!force && CHART_CACHE[ck] && Date.now()-CHART_CACHE[ck].at<(kind==='minute'?25000:300000)){
    paintChart(code, kind, CHART_CACHE[ck].data); return;
  }
  if(CHART_LOAD[ck]) return; CHART_LOAD[ck]=true;
  if(msg){ msg.style.display='flex'; msg.textContent='加载中…'; }
  try{
    const q=kind==='day'?'?kind=day&n=60':'?kind=minute';
    const data=await api('/api/chart/'+code+q);
    CHART_CACHE[ck]={at:Date.now(), data};
    paintChart(code, kind, data);
  }catch(e){
    if(msg){ msg.style.display='flex'; msg.textContent=String(e.message||e).slice(0,80); }
    if(info) info.textContent='未取到';
  }finally{ delete CHART_LOAD[ck]; }
}
function paintChart(code, kind, data){
  const msg=document.getElementById('chmsg-'+code), info=document.getElementById('chinfo-'+code), cv=document.getElementById('cv-'+code);
  if(!cv) return;
  if(data.error || !(data.bars&&data.bars.length)){
    if(msg){ msg.style.display='flex'; msg.textContent=data.error||'暂无数据'; }
    if(info) info.textContent='未取到';
    const {ctx,w,h}=fitCanvas(cv); ctx.clearRect(0,0,w,h);
    return;
  }
  if(msg) msg.style.display='none';
  let ok=false;
  if(kind==='minute'){
    ok=drawMinute(cv, data);
    const last=data.bars[data.bars.length-1];
    let pctStr='';
    if(data.prec && last && last.p!=null){
      const p=(last.p/data.prec-1)*100;
      pctStr=` · ${p>0?'+':''}${p.toFixed(2)}%`;
    }
    if(info) info.innerHTML=`${data.day||''} · <span class="${data.prec!=null&&last.p>data.prec?'up':(data.prec!=null&&last.p<data.prec?'dn':'')}">${last?last.p.toFixed(2):'—'}${pctStr}</span>`;
  }else{
    ok=drawDay(cv, data);
    const last=data.bars[data.bars.length-1];
    const prev=data.bars.length>1?data.bars[data.bars.length-2]:null;
    let pctStr='';
    if(last&&prev&&prev.c){ const p=(last.c/prev.c-1)*100; pctStr=` · ${p>0?'+':''}${p.toFixed(2)}%`; }
    if(info) info.innerHTML=`${last?last.d:''} · <span class="${last&&prev&&last.c>=prev.c?'up':'dn'}">${last?last.c.toFixed(2):'—'}${pctStr}</span> · ${data.bars.length}日`;
  }
  if(!ok && msg){ msg.style.display='flex'; msg.textContent='绘制失败'; }
}

function fcLink(code){
  return `<a class="btn mini sec" href="/fivecore/?t=${encodeURIComponent(TK)}#analyze=${code}" onclick="event.stopPropagation()">五核</a>`;
}
const CATK={pass:'yes',user:'yes',exclude:'no',unverified:'hold'};
const CATC={正面:'yes',负面:'no',风险:'watch',中性:'na'};
function catHtml(c, flag, kind){
  const f=flag||(c&&c.flag); if(!f && !c) return '';
  const k=kind||(c&&c.flag_kind)||'unverified';
  let h=`<div class="cat"><span class="tag t-${CATK[k]||'hold'}">${esc(f||'未核验')}</span>`;
  const top=(c&&c.top)||[];
  if(top.length){
    h+=top.slice(0,3).map(x=>`<div class="ci"><span class="tag t-${CATC[x.cls]||'na'}">${esc(x.cls)}${x.label?'·'+esc(x.label):''}</span>`+
      (x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(x.title)}</a>`:esc(x.title))+
      ` <span class="c">${esc(x.date||'')} · ${esc(x.source||'')}</span></div>`).join('');
  } else if(c && c.reason && c.status!=='ok'){
    h+=`<div class="ci c">${esc(c.reason)}</div>`;
  }
  if(c && c.fetched_at) h+=`<div class="ci c">抓取于 ${esc(c.fetched_at)}${c.ann_source?' · 公告源 '+esc(c.ann_source):''}${c.window?' · 区间 '+esc(c.window):''}</div>`;
  return h+`</div>`;
}

    const conf=(tp&&tp.confirmed)||[];
    const focus=(tp&&tp.focus)||[];
    h+=`<div class="note">今日交易池来自开盘确认「可建仓」+ 竞价重点。Render 免费盘重启后会按公开数据重建；用户标注保存在 trade_pool.json。</div>`;
    h+=`<h2 style="font-size:15px;margin:8px 0 6px">确认可建仓（${conf.length}）</h2>`;
    if(!conf.length) h+=`<div class="empty">暂无（需 09:40 确认通过）</div>`;
    else h+=conf.map(r=>`<div class="acard yes"><div class="hd"><div><div class="name">${esc(r.name)} <span class="c">${r.code}</span></div>
      <div class="c">${esc(r.buy_point||'—')}</div><div class="reason">${esc(r.reason||'')}</div></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${fcLink(r.code)}${grokBtn(r.code)}</div></div></div>`).join('');
    h+=`<h2 style="font-size:15px;margin:14px 0 6px">竞价重点（${focus.length}）</h2>`;
    if(!focus.length) h+=`<div class="empty">暂无</div>`;
    else h+=focus.map(r=>`<div class="acard hold"><div class="name">${esc(r.name)} <span class="c">${r.code}</span>
      <span class="tag">${esc(r.conclusion||'—')}</span> ${esc(r.buy_point||'')}</div>
      <div class="c">${esc((r.src||[]).join(' · '))}</div></div>`).join('');
    h+=`<div class="meta">可在观察池卡片点「五核」调用五核智选分析；分析会附带 pool_context。</div>${meta(d.trade_pool)}</div>`;
  }

  h+=`<div class="meta">${esc(d.disclaimer||'')}</div>`;
  $('#main').innerHTML=h;
}

/* ---------- notifications + pull refresh ---------- */
let SW=null; if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').then(r=>SW=r).catch(()=>{});}
async function askPerm(){ if(!('Notification' in window)){toast('此浏览器不支持通知');return;} await Notification.requestPermission(); unlockAudio(); render(true);}
let AC=null; function unlockAudio(){ try{AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume();}catch(e){} }
document.addEventListener('click',unlockAudio,{once:false});
function beep(){ try{unlockAudio(); const o=AC.createOscillator(),g=AC.createGain(); o.connect(g);g.connect(AC.destination); o.frequency.value=880; g.gain.setValueAtTime(.25,AC.currentTime); o.start(); o.frequency.setValueAtTime(660,AC.currentTime+.18); g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.5); o.stop(AC.currentTime+.5);}catch(e){} }
function toast(m){const t=$('#toast'); t.innerHTML=esc(m); t.style.display='block'; clearTimeout(window._tt); window._tt=setTimeout(()=>t.style.display='none',5000);}
async function notify(title,body){ beep(); if(navigator.vibrate) navigator.vibrate([200,100,200]); toast(title+'：'+body);
  if('Notification' in window && Notification.permission==='granted'){ try{ if(SW) await SW.showNotification(title,{body,icon:'/icon.png',tag:body.slice(0,40)}); else new Notification(title,{body,icon:'/icon.png'});}catch(e){} } }
function testN(){ notify('测试提醒','声音+震动+系统通知'); }
let SEEN=null;
async function poll(){ try{ const p=await api('/api/poll');
  $('#hdr-r').innerHTML=`${esc(p.phase_cn)}<br>${esc(p.now.slice(5,16))} 北京`;
  const ids=new Set([...p.alerts.map(a=>'a'+a.id),...p.events.map(e=>'e'+e.id)]);
  if(SEEN){ for(const a of p.alerts) if(!SEEN.has('a'+a.id)) notify('价格提醒',a.msg);
            for(const e of p.events) if(!SEEN.has('e'+e.id) && e.src==='live') notify('异动 '+e.name,e.kind+' '+e.detail+' '+e.time); }
  SEEN=SEEN?new Set([...SEEN,...ids]):ids; }catch(e){ $('#hdr-r').textContent='连接失败'; } }

/* pull to refresh */
let pullY=0, pulling=false;
document.addEventListener('touchstart',e=>{ if(window.scrollY<=0){pulling=true;pullY=e.touches[0].clientY;} },{passive:true});
document.addEventListener('touchmove',e=>{ if(!pulling) return; if(e.touches[0].clientY-pullY>70){ pulling=false; toast('刷新中…'); render(true); poll(); }},{passive:true});
document.addEventListener('touchend',()=>{pulling=false;});

nav(); render(true); poll();
setInterval(poll,10000); setInterval(()=>{ if(!document.hidden) render(false); },20000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){poll();render(true);} });
</script></body></html>
