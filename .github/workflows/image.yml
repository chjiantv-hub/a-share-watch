# Builds the Docker image on every push to main and publishes ghcr.io/<owner>/a-share-watch-cloud:latest (for ClawCloud Run).
name: build-image
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: n
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "cloud=ghcr.io/${owner}/a-share-watch-cloud" >> "$GITHUB_OUTPUT"
          echo "short=ghcr.io/${owner}/a-share-watch" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.n.outputs.cloud }}:latest,${{ steps.n.outputs.cloud }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=a-share-watch
      # Optional alias package (may lack write_package for GITHUB_TOKEN); cloud tag is the deploy source of truth.
      - name: Also tag ghcr.io/.../a-share-watch:latest
        continue-on-error: true
        run: |
          set -e
          docker buildx imagetools create             -t ${{ steps.n.outputs.short }}:latest             -t ${{ steps.n.outputs.short }}:${{ github.sha }}             ${{ steps.n.outputs.cloud }}:${{ github.sha }}
